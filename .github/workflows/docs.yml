name: docs

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # Checkout the repo
    - uses: actions/checkout@v3

    # Setup Python
    - uses: actions/setup-python@v4
      with:
        python-version: 3.12

    # Install uv
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.22"

    # Install dependencies using uv
    - name: Install Python dependencies
      run: |
        uv pip install --upgrade pip
        uv pip install -e .
        uv pip install mkdocs mkdocs-material "mkdocstrings[python]==0.26.2" mkdocs-jupyter
    # Copy the hand-picked tutorial notebooks into the docs tree so
    # mkdocs-jupyter (and the nav paths in mkdocs.yml) can find them.
    - name: Stage tutorial notebooks
      run: |
        mkdir -p docs/tutorials
        cp -r Tutorials/PipelineTutorials docs/tutorials/
        cp -r Tutorials/DeepDives docs/tutorials/
        cp Tutorials/DevGuide.ipynb docs/tutorials/
        # drop non-page support files the notebooks reference but that
        # shouldn't be built as their own pages
        rm -f docs/tutorials/PipelineTutorials/*.yaml
        rm -rf docs/tutorials/PipelineTutorials/tutorial_res
        rm -f docs/tutorials/DeepDives/*.yaml

    # Build the documentation
    - name: Build docs
      run: uv run mkdocs build

    # Deploy to GitHub Pages using peaceiris
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
