name: docs

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # Checkout the repo
    - uses: actions/checkout@v3

    # Setup Python
    - uses: actions/setup-python@v4
      with:
        python-version: 3.12

    # Install uv
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.22"

    # Install dependencies using uv
    - name: Install Python dependencies
      run: |
        uv pip install --upgrade pip
        uv pip install -e .
        uv pip install mkdocs mkdocs-material "mkdocstrings[python]>=1.0" mkdocs-jupyter mkdocs-llmstxt
    # Copy the hand-picked tutorial notebooks into the docs tree so
    # mkdocs-jupyter (and the nav paths in mkdocs.yml) can find them.
    - name: Stage tutorial notebooks
      run: |
        mkdir -p docs/tutorials
        cp -r Tutorials/PipelineTutorials docs/tutorials/
        cp -r Tutorials/DeepDives docs/tutorials/
        cp Tutorials/DevGuide.ipynb docs/tutorials/
        # drop non-page support files the notebooks reference but that
        # shouldn't be built as their own pages
        rm -f docs/tutorials/PipelineTutorials/*.yaml
        rm -rf docs/tutorials/PipelineTutorials/tutorial_res
        rm -f docs/tutorials/DeepDives/*.yaml

    # Use the README as the docs front page. On GitHub the README links to the
    # notebooks in the repo; on the docs site those links should open the
    # rendered tutorial pages instead, so rewrite them in the docs copy only.
    - name: Sync README to docs front page
      run: |
        cp README.md docs/index.md
        # notebook links -> relative .ipynb paths (mkdocs turns them into page URLs)
        sed -E -i 's#https://github\.com/jan-forest/autoencodix_package/blob/main/Tutorials/([A-Za-z0-9_./-]+\.ipynb)#tutorials/\1#g' docs/index.md
        # tutorial folder links have no docs page -> tutorial overview on the front page
        sed -E -i 's#https://github\.com/jan-forest/autoencodix_package/tree/main/Tutorials[A-Za-z0-9_/]*#\#tutorials#g' docs/index.md

    # Build the documentation
    - name: Build docs
      run: mkdocs build

    # Deploy to GitHub Pages using peaceiris
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
